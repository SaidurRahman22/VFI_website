<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin Sign In | VFI</title>
  <link rel="icon" type="image/png" href="assets/img/vfi-emblem.png" />
  <style>
    :root{
      --blue:#2f62a8; --blue-d:#234f88; --navy:#152440; --crimson:#951245;
      --line:#e4e7f0; --muted:#5c6577; --bg:#eef2f8; --card:#fff;
      --grad:linear-gradient(120deg,#196fbb,#643976,#951245);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"DM Sans",system-ui,Segoe UI,Roboto,sans-serif;color:var(--navy);
      background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px}
    .al-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
      border-radius:20px;box-shadow:0 24px 60px rgba(21,36,64,.14);overflow:hidden}
    .al-head{background:var(--navy);color:#fff;padding:26px 28px;text-align:center;position:relative}
    .al-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
    .al-mark{width:56px;height:56px;border-radius:14px;background:#fff;padding:6px;display:grid;
      place-items:center;margin:0 auto 12px}
    .al-mark img{width:100%;height:100%;object-fit:contain}
    .al-head h1{font-family:"Quicksand",sans-serif;font-size:1.25rem;margin:0}
    .al-head p{margin:6px 0 0;font-size:.85rem;color:rgba(255,255,255,.75)}
    .al-body{padding:26px 28px 30px}
    .al-step{display:none} .al-step.is-on{display:block}
    label{display:block;font-family:"Quicksand",sans-serif;font-weight:600;font-size:.82rem;
      margin:0 0 6px;color:var(--navy)}
    input{width:100%;padding:.75em 1em;border:1.6px solid var(--line);border-radius:12px;
      background:#fbfcfe;font-size:15px;margin-bottom:16px;font-family:inherit}
    input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,98,168,.14)}
    .al-btn{width:100%;padding:.85em;border:0;border-radius:12px;background:var(--grad);color:#fff;
      font-family:"Quicksand",sans-serif;font-weight:700;font-size:15px;cursor:pointer}
    .al-btn:disabled{opacity:.6;cursor:progress}
    .al-msg{font-size:.85rem;padding:10px 12px;border-radius:10px;margin-bottom:16px;display:none}
    .al-msg.err{display:block;background:#fdecef;color:#951245;border:1px solid #f4c9d5}
    .al-msg.ok{display:block;background:#e9f5ee;color:#0b6b48;border:1px solid #bfe6cf}
    .al-qr{display:grid;place-items:center;margin:6px 0 14px}
    .al-qr svg{width:200px;height:200px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}
    .al-secret{font-family:ui-monospace,Consolas,monospace;background:#f4f6fb;border:1px dashed var(--line);
      border-radius:8px;padding:8px 10px;font-size:.8rem;text-align:center;letter-spacing:1px;margin-bottom:16px;word-break:break-all}
    .al-hint{font-size:.8rem;color:var(--muted);line-height:1.6;margin:0 0 16px}
    .al-foot{text-align:center;margin-top:16px;font-size:.8rem;color:var(--muted)}
    .al-foot a{color:var(--blue);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main class="al-card">
    <div class="al-head">
      <div class="al-mark"><img src="assets/img/vfi-emblem.png" alt="VFI" /></div>
      <h1>VFI Admin</h1>
      <p>Staff sign-in · two-factor required</p>
    </div>
    <div class="al-body">
      <div class="al-msg" id="alMsg"></div>

      <!-- step 1: password -->
      <form class="al-step is-on" id="stepPassword" autocomplete="on">
        <label for="alEmail">Email</label>
        <input type="email" id="alEmail" name="email" required autocomplete="username" />
        <label for="alPass">Password</label>
        <input type="password" id="alPass" name="password" required autocomplete="current-password" />
        <button class="al-btn" type="submit">Continue</button>
      </form>

      <!-- step 2: TOTP verify -->
      <form class="al-step" id="stepTotp" autocomplete="off">
        <p class="al-hint">Enter the 6-digit code from your authenticator app.</p>
        <label for="alCode">Authentication code</label>
        <input type="text" id="alCode" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" />
        <button class="al-btn" type="submit">Verify &amp; sign in</button>
      </form>

      <!-- step 3: TOTP enrolment -->
      <form class="al-step" id="stepEnroll" autocomplete="off">
        <p class="al-hint">First sign-in: scan this QR with Google Authenticator / Authy, then enter the code to finish enrolment.</p>
        <div class="al-qr" id="alQr"></div>
        <div class="al-secret" id="alSecret"></div>
        <label for="alEnrollCode">Enter the 6-digit code</label>
        <input type="text" id="alEnrollCode" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" />
        <button class="al-btn" type="submit">Confirm &amp; sign in</button>
      </form>

      <p class="al-foot"><a href="index.html">&larr; Back to website</a></p>
    </div>
  </main>

  <script src="js/api.js?v=95e7c55d"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var msg = $("#alMsg");
      function show(id) {
        ["stepPassword", "stepTotp", "stepEnroll"].forEach(function (s) {
          $("#" + s).classList.toggle("is-on", s === id);
        });
      }
      function say(text, kind) { msg.className = "al-msg " + (kind || "err"); msg.textContent = text; }
      function clearMsg() { msg.className = "al-msg"; msg.textContent = ""; }
      function busy(form, on) { var b = form.querySelector("button"); b.disabled = on; }

      // If already signed in, go straight to the panel.
      window.VFIApi.get("/api/admin/me", { noRedirect: true })
        .then(function () { window.location.href = "admin.html"; })
        .catch(function () { /* stay on login */ });

      // step 1 — password
      $("#stepPassword").addEventListener("submit", function (e) {
        e.preventDefault(); clearMsg(); busy(this, true);
        var email = $("#alEmail").value.trim(), password = $("#alPass").value;
        window.VFIApi.post("/api/admin/login", { email: email, password: password }, { noRedirect: true })
          .then(function (r) {
            if (r.step === "totp") { show("stepTotp"); $("#alCode").focus(); }
            else if (r.step === "enroll") { startEnroll(); }
          })
          .catch(function (err) { say(err.status === 423 ? "Account temporarily locked. Try again later." : "Invalid credentials."); })
          .finally(function () { busy($("#stepPassword"), false); });
      });

      // step 2 — verify TOTP
      $("#stepTotp").addEventListener("submit", function (e) {
        e.preventDefault(); clearMsg(); busy(this, true);
        window.VFIApi.post("/api/admin/login/totp", { code: $("#alCode").value }, { noRedirect: true })
          .then(function () { window.location.href = "admin.html"; })
          .catch(function () { say("Invalid or reused code."); })
          .finally(function () { busy($("#stepTotp"), false); });
      });

      // step 3 — enrolment
      function startEnroll() {
        window.VFIApi.post("/api/admin/mfa/enroll", {}, { noRedirect: true })
          .then(function (r) {
            $("#alQr").innerHTML = r.qr_svg;
            $("#alSecret").textContent = r.secret;
            show("stepEnroll"); $("#alEnrollCode").focus();
          })
          .catch(function () { say("Could not start enrolment. Please retry sign-in."); });
      }
      $("#stepEnroll").addEventListener("submit", function (e) {
        e.preventDefault(); clearMsg(); busy(this, true);
        window.VFIApi.post("/api/admin/mfa/confirm", { code: $("#alEnrollCode").value }, { noRedirect: true })
          .then(function () { window.location.href = "admin.html"; })
          .catch(function () { say("Code did not match. Re-scan and try again."); })
          .finally(function () { busy($("#stepEnroll"), false); });
      });
    })();
  </script>
</body>
</html>
