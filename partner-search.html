<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="VFI Partner console — search and shortlist from over 100,000 overseas study programs, then compare universities and apply." />
  <title>Search Programs | VFI Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/partner-portal.css" />
  <script>document.documentElement.className += " js";</script>
  <link rel="icon" type="image/png" href="assets/img/vfi-emblem.png" />
  <style>
    /* ============================================================= page-scoped
       Every selector is prefixed with .pg-search so nothing here can reach the
       shared pp- component system (partner-portal.css is read-only).
       ============================================================= */
    .pg-search__hero { text-align: center; max-width: 720px; margin: 4px auto 26px; }
    .pg-search__hero h1 { font-size: 30px; line-height: 1.2; }
    .pg-search__hero p { color: var(--pp-muted); font-size: 15.5px; margin-top: 9px; }

    /* prominent search card */
    .pg-search__searchcard { border-color: #cfe7e3; }
    .pg-search__searchrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
    .pg-search__searchrow .pp-field { flex: 1 1 168px; min-width: 150px; }
    .pg-search__searchrow .pg-search__field--grow { flex: 2 1 260px; }
    .pg-search__searchrow .pg-search__field--btn { flex: 0 0 auto; }
    .pg-search__field--btn .pp-btn { min-width: 128px; }
    .pg-search .pp-search-wrap { position: relative; display: block; }

    /* advanced search */
    .pg-search__advhead { position: relative; text-align: center; margin: 30px 0 16px; min-height: 26px; }
    .pg-search__advtitle {
      font-family: var(--pp-display); font-weight: 700; color: var(--pp-teal-dark);
      font-size: 19px; display: inline-block; cursor: pointer;
    }
    .pg-search__advtitle:hover { color: var(--pp-teal); }
    .pg-search__advtitle:focus-visible { outline: 2px solid var(--pp-teal); outline-offset: 4px; border-radius: 6px; }
    .pg-search__clear {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      font-size: 13.5px; font-weight: 600; color: var(--pp-teal); cursor: pointer;
    }
    .pg-search__clear:hover { text-decoration: underline; }

    .pg-search__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .pg-search__col { padding: 2px 28px; min-width: 0; }
    .pg-search__col:first-child { padding-left: 2px; }
    .pg-search__col:last-child { padding-right: 2px; }
    .pg-search__col + .pg-search__col { border-left: 1px solid var(--pp-line); }
    .pg-search__coltitle { font-size: 16px; font-family: var(--pp-display); font-weight: 700; color: var(--pp-ink); margin-bottom: 12px; }
    .pg-search__col .pp-field + .pp-field { margin-top: 14px; }
    .pg-search__checks { display: flex; flex-direction: column; gap: 1px; }

    .pg-search__closebar { display: flex; justify-content: center; margin-top: 18px; }

    /* quick filters */
    .pg-search__qftitle { display: flex; align-items: center; gap: 8px; }
    .pg-search__qftitle .ic { color: var(--pp-teal); }
    .pg-search__chips { display: flex; flex-wrap: wrap; gap: 10px; }

    /* the advanced panel can be collapsed by the Close button */
    .pg-search__advwrap.is-collapsed .pg-search__adv,
    .pg-search__advwrap.is-collapsed .pg-search__closebar { display: none; }

    @media (max-width: 900px) {
      .pg-search__cols { grid-template-columns: 1fr; }
      .pg-search__col { padding: 20px 2px; }
      .pg-search__col:first-child { padding-top: 2px; }
      .pg-search__col + .pg-search__col { border-left: 0; border-top: 1px solid var(--pp-line); }
    }
    @media (max-width: 600px) {
      .pg-search__hero h1 { font-size: 23px; }
      .pg-search__clear { position: static; transform: none; display: inline-block; margin-top: 8px; }
      .pg-search__advhead { margin-bottom: 12px; }
    }
    @media (max-width: 520px) {
      .pg-search__searchrow .pg-search__field--btn { flex: 1 1 100%; }
      .pg-search__field--btn .pp-btn { width: 100%; }
    }

    /* ---- results ---- */
    .pg-search__reshead { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 30px 0 10px; }
    .pg-search__reshead .pp-section-title { margin: 0; }
    .pg-search__sort { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .pg-search__sort .pp-field__label { margin: 0; }
    .pg-search__sort .pp-select { width: auto; }
    .pg-search__results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .pg-search__msg { grid-column: 1 / -1; text-align: center; color: var(--pp-muted); padding: 34px 10px; font-size: 15px; }

    .pg-card { border: 1px solid var(--pp-line); border-radius: 14px; background: #fff; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--pp-shadow-sm); transition: box-shadow .16s var(--pp-ease), transform .16s var(--pp-ease); }
    .pg-card:hover { box-shadow: var(--pp-shadow); transform: translateY(-2px); }
    .pg-card__top { display: flex; align-items: flex-start; gap: 10px; }
    .pg-card__cmp { margin-top: 3px; flex: none; }
    .pg-card__title { font-family: var(--pp-display); font-weight: 700; font-size: 15.5px; color: var(--pp-ink); line-height: 1.28; }
    .pg-card__uni { color: var(--pp-teal-dark); font-weight: 600; font-size: 13.5px; margin-top: 2px; }
    .pg-card__meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--pp-muted); }
    .pg-card__meta b { color: var(--pp-slate); font-weight: 600; }
    .pg-card__badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .pg-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--pp-teal-soft); color: var(--pp-teal-dark); }
    .pg-badge--coral { background: #fbe1e9; color: var(--pp-emerald); }
    .pg-badge--stale { background: #fde7d6; color: #92400e; }
    .pg-card__foot { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .pg-card__foot .pp-btn { flex: 1; }

    .pg-search__pager { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 22px 0 4px; }
    .pg-search__pageinfo { font-size: 13.5px; color: var(--pp-muted); font-weight: 600; }

    /* ---- floating compare bar ---- */
    .pg-cmpbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60;
      display: flex; align-items: center; gap: 12px; background: var(--pp-ink); color: #fff;
      padding: 10px 12px 10px 18px; border-radius: 999px; box-shadow: 0 16px 40px rgba(20,28,38,.34); font-size: 13.5px; font-weight: 600; }

    /* ---- modal ---- */
    .pg-modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; }
    .pg-modal__backdrop { position: absolute; inset: 0; background: rgba(16,22,34,.5); }
    .pg-modal__panel { position: relative; width: min(760px, 100%); max-height: 88vh; overflow: auto; background: #fff; border-radius: 18px; box-shadow: 0 30px 70px rgba(16,22,34,.4); }
    .pg-modal__head { position: sticky; top: 0; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--pp-line); }
    .pg-modal__head h3 { font-family: var(--pp-display); font-weight: 700; font-size: 17px; color: var(--pp-ink); margin: 0; }
    .pg-modal__x { border: 0; background: var(--pp-app); border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--pp-muted); }
    .pg-modal__x:hover { background: var(--pp-line); }
    .pg-modal__body { padding: 18px 20px 22px; }
    .pg-dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 13.5px; }
    .pg-dl dt { color: var(--pp-muted); font-weight: 600; }
    .pg-dl dd { color: var(--pp-slate); margin: 0; }
    .pg-cmpgrid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: 0; overflow-x: auto; }
    .pg-cmpgrid__col { padding: 10px 12px; border-left: 1px solid var(--pp-line); }
    .pg-cmpgrid__col:first-child { border-left: 0; }
    .pg-cmpgrid__row { font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--pp-line-2); }
    .pg-cmpgrid__k { color: var(--pp-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
    .pg-shortlist { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--pp-line); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .pg-shortlist .pp-field { flex: 1 1 200px; }
  </style>
</head>
<body class="pp" data-pp-page="search">
  <a class="pp-skip" href="#pp-main">Skip to content</a>
  <div id="pp-chrome"></div>

  <main class="pp-main" id="pp-main">
    <div class="pp-wrap pg-search">

      <!-- hero -->
      <div class="pg-search__hero pp-anim">
        <h1>Explore over 100,000+ Programs</h1>
        <p>Use VFI course search to shortlist and compare.</p>
      </div>

      <!-- search form -->
      <div class="pp-card pg-search__searchcard pp-anim">
        <div class="pg-search__searchrow">
          <div class="pp-field pg-search__field--grow">
            <label class="pp-field__label">Search Programs</label>
            <div class="pp-search-wrap">
              <span class="pp-search-wrap__ic"><svg class="ic ic--sm"><use href="#pi-search"/></svg></span>
              <input class="pp-input" id="pgSearchInput" placeholder="Search Program / University" autocomplete="off">
            </div>
          </div>
          <div class="pp-field">
            <label class="pp-field__label">Intake</label>
            <select class="pp-select" id="pgIntake" data-tax="intake" data-tax-all="All Intakes" aria-label="Intake">
              <option value="">All Intakes</option>
            </select>
          </div>
          <div class="pp-field">
            <label class="pp-field__label">Year</label>
            <select class="pp-select" id="pgYear" aria-label="Year">
              <option value="">Any Year</option>
            </select>
          </div>
          <div class="pp-field">
            <label class="pp-field__label">Student's Nationality</label>
            <select class="pp-select" id="pgNationality" data-tax="nationality" aria-label="Student's Nationality"></select>
          </div>
          <div class="pp-field">
            <label class="pp-field__label">Student's State</label>
            <select class="pp-select" id="pgState" aria-label="Student's State">
              <option value="" disabled selected>Student's State</option>
              <option>Dhaka</option><option>Chattogram</option><option>Khulna</option>
              <option>Rajshahi</option><option>Sylhet</option><option>Barishal</option>
              <option>Rangpur</option><option>Mymensingh</option>
            </select>
          </div>
          <div class="pp-field pg-search__field--btn">
            <button class="pp-btn pp-btn--primary" id="pgSearchBtn"><svg class="ic ic--sm"><use href="#pi-search"/></svg> Search</button>
          </div>
        </div>
      </div>

      <!-- advanced search -->
      <div class="pg-search__advwrap" id="pgAdvWrap">
        <div class="pg-search__advhead">
          <h2 class="pg-search__advtitle" id="pgAdvTitle" role="button" tabindex="0" aria-expanded="true" aria-controls="pgAdvPanel">Advanced Search</h2>
          <a class="pg-search__clear" id="pgClearAll" role="button" tabindex="0">Clear All</a>
        </div>

        <div class="pp-card pg-search__adv pp-anim" id="pgAdvPanel">
          <div class="pg-search__cols">

            <!-- Program Level (populated from the served taxonomy) -->
            <div class="pg-search__col">
              <h3 class="pg-search__coltitle">Program Level</h3>
              <div class="pg-search__checks" id="pgLevels" data-tax-checks="level"></div>
            </div>

            <!-- Other Filters -->
            <div class="pg-search__col">
              <h3 class="pg-search__coltitle">Other Filters</h3>
              <div class="pp-field">
                <label class="pp-field__label">Country</label>
                <select class="pp-select" id="pgCountry" data-tax="country" data-tax-all="Any Country">
                  <option value="">Any Country</option>
                </select>
              </div>
              <div class="pp-field">
                <label class="pp-field__label">Study Area</label>
                <select class="pp-select" id="pgStudyArea" data-tax="study_area" data-tax-all="Any Study Area">
                  <option value="">Any Study Area</option>
                </select>
              </div>
              <div class="pp-field">
                <label class="pp-field__label">Discipline Area</label>
                <select class="pp-select" id="pgDiscipline" data-tax="discipline_area" data-tax-all="Any Discipline">
                  <option value="">Any Discipline</option>
                </select>
              </div>
              <div class="pp-field">
                <label class="pp-field__label">Duration</label>
                <select class="pp-select" id="pgDuration" data-tax="duration_band" data-tax-all="Any Duration">
                  <option value="">Any Duration</option>
                </select>
              </div>
            </div>

            <!-- Requirements (each maps to a search facet token) -->
            <div class="pg-search__col">
              <h3 class="pg-search__coltitle">Requirements</h3>
              <div class="pg-search__checks" id="pgReqs">
                <label class="pp-check"><input type="checkbox" data-facet="req_pte"> Requires PTE</label>
                <label class="pp-check"><input type="checkbox" data-facet="req_toefl"> Requires TOEFL</label>
                <label class="pp-check"><input type="checkbox" data-facet="req_ielts"> Requires IELTS</label>
                <label class="pp-check"><input type="checkbox" data-facet="req_duolingo"> Requires Duolingo (DET)</label>
                <label class="pp-check"><input type="checkbox" data-facet="req_gre"> Requires GRE</label>
                <label class="pp-check"><input type="checkbox" data-facet="req_gmat"> Requires GMAT</label>
                <label class="pp-check"><input type="checkbox" data-facet="waive_english"> Without English Proficiency</label>
                <label class="pp-check"><input type="checkbox" data-facet="waive_gre"> Without GRE</label>
                <label class="pp-check"><input type="checkbox" data-facet="waive_gmat"> Without GMAT</label>
                <label class="pp-check"><input type="checkbox" data-facet="waive_maths"> Without Maths</label>
                <label class="pp-check"><input type="checkbox" data-facet="stem"> STEM Programs</label>
                <label class="pp-check"><input type="checkbox" data-facet="fee_waiver"> Application Fee Waiver</label>
                <label class="pp-check"><input type="checkbox" data-facet="scholarship"> Scholarship Available</label>
                <label class="pp-check"><input type="checkbox" data-facet="open"> Open Programs</label>
              </div>
            </div>

          </div>
        </div>

        <div class="pg-search__closebar">
          <button class="pp-btn pp-btn--ghost pp-btn--sm" id="pgAdvClose">Close <svg class="ic ic--sm"><use href="#pi-x"/></svg></button>
        </div>
      </div>

      <!-- quick filters -->
      <h2 class="pp-section-title pg-search__qftitle"><svg class="ic ic--sm"><use href="#pi-spark"/></svg> Quick Filters</h2>
      <div class="pp-card pg-search__qf pp-anim">
        <div class="pg-search__chips">
          <button type="button" class="pp-chip" data-facet="fast_offer"><svg class="ic ic--sm"><use href="#pi-spark"/></svg> Faster Offer TAT</button>
          <button type="button" class="pp-chip" data-facet="scholarship"><svg class="ic ic--sm"><use href="#pi-medal"/></svg> Scholarship Available</button>
          <button type="button" class="pp-chip" data-facet="high_acceptance"><svg class="ic ic--sm"><use href="#pi-check"/></svg> High Offer Acceptance</button>
          <button type="button" class="pp-chip" data-facet="waive_english"><svg class="ic ic--sm"><use href="#pi-book"/></svg> English Proficiency Waiver</button>
          <button type="button" class="pp-chip" data-facet="affordable"><svg class="ic ic--sm"><use href="#pi-cap"/></svg> Affordable University</button>
          <button type="button" class="pp-chip" data-facet="coop"><svg class="ic ic--sm"><use href="#pi-users"/></svg> Co-op &amp; Built-in Internships</button>
          <button type="button" class="pp-chip" data-facet="high_job_demand"><svg class="ic ic--sm"><use href="#pi-arrow"/></svg> High Job Demand</button>
          <button type="button" class="pp-chip" data-facet="low_deposit"><svg class="ic ic--sm"><use href="#pi-wallet"/></svg> No / Low Tuition Deposit</button>
          <button type="button" class="pp-chip" data-facet="major_city"><svg class="ic ic--sm"><use href="#pi-globe"/></svg> Major City</button>
          <button type="button" class="pp-chip" data-facet="no_interview"><svg class="ic ic--sm"><use href="#pi-interview"/></svg> No Interview Required</button>
          <button type="button" class="pp-chip" data-level="mba"><svg class="ic ic--sm"><use href="#pi-book"/></svg> MBA Programs</button>
          <button type="button" class="pp-chip" data-facet="moi"><svg class="ic ic--sm"><use href="#pi-doc"/></svg> MOI Acceptable</button>
          <button type="button" class="pp-chip" data-facet="own_english"><svg class="ic ic--sm"><use href="#pi-flask"/></svg> Uni has own English Test</button>
        </div>
      </div>

      <!-- results -->
      <div class="pg-search__reshead" id="pgResHead" hidden>
        <h2 class="pp-section-title" id="pgResCount">Results</h2>
        <div class="pp-field pg-search__sort">
          <label class="pp-field__label" for="pgSort">Sort</label>
          <select class="pp-select" id="pgSort">
            <option value="deadline">Soonest deadline</option>
            <option value="tuition_asc">Tuition: low → high</option>
            <option value="tuition_desc">Tuition: high → low</option>
            <option value="fastest_offer">Fastest offer</option>
            <option value="newest">Newest</option>
          </select>
        </div>
      </div>
      <div class="pg-search__results" id="pgResults" aria-live="polite"></div>
      <div class="pg-search__pager" id="pgPager" hidden>
        <button class="pp-btn pp-btn--ghost pp-btn--sm" id="pgPrev" type="button">← Prev</button>
        <span class="pg-search__pageinfo" id="pgPageInfo"></span>
        <button class="pp-btn pp-btn--ghost pp-btn--sm" id="pgNext" type="button">Next →</button>
      </div>

    </div>
  </main>

  <!-- floating compare bar (shows when programs are ticked for compare) -->
  <div class="pg-cmpbar" id="pgCmpBar" hidden>
    <span id="pgCmpCount">0 selected</span>
    <button class="pp-btn pp-btn--primary pp-btn--sm" id="pgCmpBtn" type="button">Compare</button>
    <button class="pp-btn pp-btn--ghost pp-btn--sm" id="pgCmpClear" type="button">Clear</button>
  </div>

  <!-- detail / compare modal -->
  <div class="pg-modal" id="pgModal" hidden>
    <div class="pg-modal__backdrop" data-close></div>
    <div class="pg-modal__panel" role="dialog" aria-modal="true" aria-labelledby="pgModalTitle">
      <div class="pg-modal__head">
        <h3 id="pgModalTitle">Program</h3>
        <button class="pg-modal__x" data-close type="button" aria-label="Close"><svg class="ic"><use href="#pi-x"/></svg></button>
      </div>
      <div class="pg-modal__body" id="pgModalBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="/api/content/bootstrap.js"></script>
  <script src="js/store.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/portal-render.js"></script>
  <script src="js/portal-data.js"></script>
  <script src="js/portal-search.js"></script>
</body>
</html>
