# =============================================================================
# VFI staging stack — Phase 0, step 3.
# One nginx serving the 52 static files AND proxying /api to PHP-FPM
# (same-origin invariant). Redis, Horizon, ClamAV sidecar.
#
# Managed services that are NOT in this file (provisioned in the cloud, step 4):
#   - PostgreSQL 16 + PITR  (managed; app-role has no DROP)
#   - Cloudflare R2 buckets (vfi-media-public, vfi-docs-private)
# Point the API at those via secrets, never .env-in-repo.
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [php-fpm]
    ports: ["80:80", "443:443"]
    volumes:
      - ./:/srv/vfi/site:ro                       # the static site, unchanged
      - ./deploy/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/tls:/etc/nginx/tls:ro
    restart: unless-stopped

  php-fpm:
    build: ./backend
    user: "www-data"
    env_file: [./backend/.env.docker]             # secrets injected, not committed
    depends_on: [redis, clamav]
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  horizon:
    build: ./backend
    user: "www-data"
    command: ["php", "artisan", "horizon"]         # queue runner (4 named queues)
    env_file: [./backend/.env.docker]
    depends_on: [redis, php-fpm]
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  # ClamAV sidecar — Phase 0 step 3.3 validates its ~1-2GB RAM against the 4GB
  # box. If it competes with FPM/Redis, fall back to the documented R2 scan hook.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
