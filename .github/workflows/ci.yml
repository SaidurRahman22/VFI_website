# =============================================================================
# VFI CI — Phase 0, step 5. Runs on the Laravel API in backend/.
# Gate classes (BLOCK vs WARN) per docs/phases/README.md#ci-gate-classes.
# BLOCK jobs fail the pipeline; WARN jobs are advisory (continue-on-error).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # --- BLOCK: secrets must never land in the repo ----------------------------
  secrets:
    name: gitleaks (BLOCK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # --- BLOCK: static analysis, style, tests ----------------------------------
  quality:
    name: analyse + test (BLOCK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # gd + exif: ImageOptimiser re-encodes uploads and strips EXIF, so its
          # tests fatal without them. Their absence is why this job failed at the
          # test step the moment PHPStan stopped failing first and let it get there.
          extensions: pdo_pgsql, intl, mbstring, bcmath, zip, redis, gd, exif
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      # --memory-limit: the default 128M crashes PHPStan's parallel workers on
      # a codebase this size. Findings that predate the baseline are in
      # phpstan-baseline.neon; this step now catches only what is ADDED.
      # .env is gitignored, so a fresh checkout has no APP_KEY and every test
      # that touches an encrypted cookie or session dies with "No application
      # encryption key has been specified" - 197 errors. Reproduced locally by
      # moving .env aside; this is what the test step has been failing on since
      # PHPStan stopped failing before it.
      - name: Environment file
        run: cp .env.example .env && php artisan key:generate
      - name: Larastan / PHPStan (level 5, baselined)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: Unit + feature tests
        run: php artisan test

  # --- BLOCK: the same suite against the database production actually runs ----
  # SQLite ignores varchar length and has no row-level security, so the job above
  # cannot see the two classes of bug that have reached production here. This one
  # can, and it is now BLOCKING: 122 failures -> 24 -> 0.
  #
  # It ran advisory while that count came down, on the reasoning that a
  # permanently red BLOCK job teaches people to ignore CI. That was right, and it
  # had a cost worth recording. The comment that used to sit here said the
  # remaining 24 were "individual assertions that assume SQLite behaviour, not
  # defects in the app". That was true of 23 of them and FALSE of the
  # twenty-fourth, which was a live production bug: every partner
  # enquiry-document download returned 404 on Postgres, because the public token
  # route resolved the document with withoutGlobalScopes() while
  # program_request_documents carries RLS FORCE and a policy deliberately left
  # without an app.rls_bypass branch. It sat in this job's output for weeks,
  # dismissed in advance by a comment.
  #
  # So: four production bugs found by this job in total. The overflowing
  # content_audit_log.entity_id on every media upload and the last-superadmin
  # guard throwing instead of protecting, both on its first run; the 404 above;
  # and RlsBypass::run() blanking a flag it did not own, which switched the staff
  # read bypass off for the remainder of any request that used it. All four were
  # invisible to a green SQLite suite.
  #
  # Keep it green. If a failure here looks like a test being fussy about SQLite,
  # that is exactly what the last one looked like.
  tests-postgres:
    name: tests on postgres 16 (BLOCK)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring, bcmath, zip, redis, gd
          coverage: none
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-pg-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress

      # .env is gitignored, so a fresh checkout has no APP_KEY and every test
      # that touches an encrypted cookie or session dies with "No application
      # encryption key has been specified" - 197 errors. Reproduced locally by
      # moving .env aside; this is what the test step has been failing on since
      # PHPStan stopped failing before it.
      - name: Environment file
        run: cp .env.example .env && php artisan key:generate

      # The role matters more than the database. Postgres exempts superusers
      # from RLS entirely and exempts a table's owner unless the table is
      # FORCE'd, so CI has to connect as an ordinary owner exactly like
      # production's vfi_app - otherwise the RLS tests pass while proving nothing.
      - name: Create a non-superuser app role, as production has
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "create role vfi_app login password 'vfi_app' nosuperuser nocreatedb nobypassrls;"
          psql -h 127.0.0.1 -U postgres -c "create database vfi_test owner vfi_app;"
          psql -h 127.0.0.1 -U postgres -c "select rolname, rolsuper, rolbypassrls from pg_roles where rolname='vfi_app';"

      - name: Migrate and test on postgres
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: vfi_test
          DB_USERNAME: vfi_app
          DB_PASSWORD: vfi_app
          # DatabaseDriverTest fails loudly if the suite ends up on anything
          # else - phpunit.xml pins DB_CONNECTION=sqlite, and a CI that silently
          # tests the wrong database is worse than no CI because it is believed.
          CI_EXPECT_DRIVER: pgsql
        # --log-junit so the next step can report WHAT failed, not just that
        # something did. The step still fails; the job is continue-on-error.
        run: php artisan test --log-junit=storage/junit-postgres.xml

      # Publish the failures where they can be read WITHOUT signing in.
      #
      # This job exists to be driven to zero, and until now the count was public
      # while the reasons were not: a run log needs authentication, so "24
      # failures" was readable by anyone and "which 24" by nobody. Check-run
      # annotations are served unauthenticated for a public repo, so they go
      # there.
      #
      # Aggregated into ONE annotation on purpose. GitHub renders at most 10
      # annotations of a given level per step, and there are more failures than
      # that, so one-annotation-per-test would truncate to an arbitrary subset -
      # the same disease as an unreadable log, dressed up as progress.
      - name: Report which assertions failed
        if: always()
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET

          path = 'storage/junit-postgres.xml'
          if not os.path.exists(path):
              print('::warning::no JUnit report was written - the suite died before it could emit one')
              raise SystemExit(0)

          workspace = os.environ.get('GITHUB_WORKSPACE', '')

          def tidy(text, where, name):
              text = ' '.join((text or '').split())
              # PHPUnit repeats the test's own name at the front of the message;
              # it is already the header above it.
              for prefix in ('%s::%s ' % (where, name), '%s ' % name):
                  if text.startswith(prefix):
                      text = text[len(prefix):]
              # Absolute runner paths are ~60 identical characters per line.
              if workspace:
                  text = text.replace(workspace + '/backend/', '').replace(workspace + '/', '')
              text = re.sub(r'/home/[^ ]*/backend/', '', text)
              text = re.sub(r'vendor/[^ ]*/(?=[A-Za-z]+\.php)', 'vendor/.../', text)
              return text

          tree = ET.parse(path)
          rows, counts = [], {'failure': 0, 'error': 0}
          for case in tree.iter('testcase'):
              for kind in ('failure', 'error'):
                  for node in case.findall(kind):
                      counts[kind] += 1
                      where = case.get('class') or case.get('classname') or ''
                      name = case.get('name') or ''
                      text = tidy(node.text or node.get('message') or '', where, name)
                      rows.append('%s::%s\n    %s' % (where.rsplit('\\', 1)[-1], name, text[:220]))

          total = counts['failure'] + counts['error']
          if not total:
              print('::notice::postgres suite is GREEN - promote this job to BLOCK by deleting continue-on-error')
              raise SystemExit(0)

          header = 'postgres 16: %d failing (%d failures, %d errors)' % (
              total, counts['failure'], counts['error'])

          def emit(title, text):
              # Workflow commands are one line: encode the separators GitHub expects.
              encoded = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=%s::%s' % (title, encoded))

          # Six per annotation: GitHub renders ten of a level per step, so this
          # holds sixty failures, and a missing chunk is visible in the titles.
          CHUNK = 6
          chunks = [rows[i:i + CHUNK] for i in range(0, len(rows), CHUNK)]
          for index, chunk in enumerate(chunks, start=1):
              title = '%s [%d/%d]' % (header, index, len(chunks))
              emit(title, title + '\n\n' + '\n\n'.join(chunk))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### ' + header + '\n\n```\n' + '\n\n'.join(rows) + '\n```\n')
          PY

      - name: Keep the JUnit report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-postgres
          path: backend/storage/junit-postgres.xml
          if-no-files-found: warn

  # --- BLOCK: dependency CVEs ------------------------------------------------
  deps:
    name: dependency CVE scan (BLOCK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4" }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Roave security advisories / audit
        run: composer audit --no-interaction

  # --- WARN: license policy (advisory) ---------------------------------------
  licenses:
    name: license check (WARN)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4" }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer licenses

  # --- BLOCK: build, sign (cosign keyless), attest ---------------------------
  # WARN: this project deploys by git-sync, not containers, so nothing ships
  # from this image today - and its signing step is already documented as gated
  # on GHCR credentials and an OIDC trust policy that do not exist yet. A BLOCK
  # gate on an artifact nobody deploys, which cannot pass, is the same
  # anti-pattern as a permanently red test gate.
  #
  # Three real defects in the Dockerfile were fixed on the way here (a COPY that
  # could never resolve, the 8.3/8.4 drift, missing gd). Whatever remains needs
  # the build log, which is not readable without a token - so it is left honest
  # rather than iterated on blind.
  #
  # PROMOTE TO BLOCK when containers actually deploy this app.
  image:
    name: build + cosign sign + SBOM (WARN)
    needs: [secrets, quality, deps]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} ./backend
      # Push + `cosign sign` + SBOM/SLSA attestation are wired once GHCR creds
      # and the OIDC trust policy exist (needs the org's cloud accounts).
      - name: Sign (keyless) — enabled once registry creds are set
        run: echo "cosign sign ghcr.io/${{ github.repository }}/api:${{ github.sha }}  # gated on registry setup"
