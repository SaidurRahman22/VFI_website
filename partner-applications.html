<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="VFI Partner console — track every student application in one place." />
  <title>Applications | VFI Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/partner-portal.css" />
  <script>document.documentElement.className += " js";</script>
  <link rel="icon" type="image/png" href="assets/img/vfi-emblem.png" />
  <style>
    /* page-scoped — every selector prefixed .pg-app, so nothing here can reach
       another console page. The shared sheet has no danger badge and no
       timeline; both only exist on this screen. */
    .pg-app__badge--bad { background: #fdecec; color: var(--pp-danger); }

    /* summary block */
    .pg-app__grid { display: grid; grid-template-columns: 155px 1fr; gap: 9px 18px; margin: 0; }
    .pg-app__k { color: var(--pp-muted); font-size: 13px; }
    .pg-app__v { color: var(--pp-ink); font-size: 14px; font-weight: 600; margin: 0; word-break: break-word; }

    /* status history */
    .pg-app__hist { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--pp-line); }
    .pg-app__ev { position: relative; padding: 0 0 16px 14px; }
    .pg-app__ev:last-child { padding-bottom: 0; }
    .pg-app__ev::before {
      content: ""; position: absolute; left: -24px; top: 4px; width: 10px; height: 10px;
      border-radius: 50%; background: var(--pp-teal); border: 2px solid #fff;
    }
    .pg-app__ev-head { font-family: var(--pp-display); font-weight: 700; color: var(--pp-ink); font-size: 14px; }
    .pg-app__ev-meta { color: var(--pp-muted); font-size: 12.5px; margin-top: 2px; }
    .pg-app__ev-note { color: var(--pp-slate); font-size: 13.5px; margin-top: 4px; }

    /* readiness banner — the reason this screen exists */
    .pg-app__banner {
      border-radius: var(--pp-radius-sm); padding: 12px 14px; font-size: 13.5px; margin-bottom: 14px;
      background: #fdf3e3; color: var(--pp-warn); border: 1px solid #f6dfb4;
    }
    .pg-app__banner--bad { background: #fdecec; color: var(--pp-danger); border-color: #f6cccc; }
    .pg-app__banner--ok { background: #e7f7ef; color: var(--pp-ok); border-color: #bfe6d4; }

    /* checklist rows */
    .pg-app__doc { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--pp-line-2); }
    .pg-app__doc:last-child { border-bottom: 0; }
    .pg-app__doc-main { flex: 1 1 auto; min-width: 0; }
    .pg-app__doc-name { font-family: var(--pp-display); font-weight: 700; color: var(--pp-ink); font-size: 14px; }
    .pg-app__doc-meta { color: var(--pp-muted); font-size: 12.5px; margin-top: 3px; word-break: break-word; }
    .pg-app__doc-why { color: var(--pp-danger); font-size: 12.5px; margin-top: 3px; word-break: break-word; }
    .pg-app__doc-msg { color: var(--pp-muted); font-size: 12.5px; margin-top: 4px; }
    .pg-app__doc-act { display: flex; align-items: center; gap: 8px; flex: none; }

    /* the file input covers its own label: one control, still keyboard-reachable
       (display:none would take it out of the tab order) */
    .pg-app__up { position: relative; overflow: hidden; margin: 0; }
    .pg-app__up input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    @media (max-width: 560px) {
      .pg-app__grid { grid-template-columns: 1fr; gap: 2px 0; }
      .pg-app__grid .pg-app__v { margin-bottom: 10px; }
      .pg-app__doc { flex-wrap: wrap; }
    }
  </style>
</head>
<body class="pp" data-pp-page="applications">
  <a class="pp-skip" href="#pp-main">Skip to content</a>
  <div id="pp-chrome"></div>

  <main class="pp-main" id="pp-main">
    <div class="pp-wrap">

      <!-- page head -->
      <div class="pp-head pp-anim">
        <div>
          <h1 class="pp-head__title">Applications</h1>
          <p class="pp-head__sub">Track every student application in one place.</p>
        </div>
      </div>

      <!-- Empty notice. Hidden by js/portal-data.js as soon as the applications
           table has rows — it used to sit permanently above a populated table,
           telling the partner they had no applications while listing them. -->
      <div class="pp-notice pp-anim" id="ppAppsEmpty">
        <svg class="pg-app__art" viewBox="0 0 220 170" role="img" aria-label="No applications illustration" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto 18px;width:172px;max-width:56%">
          <ellipse cx="110" cy="146" rx="78" ry="11" fill="#e6fbf6"/>
          <rect x="70" y="34" width="78" height="98" rx="10" fill="#f2fbf9" stroke="#9ccfc9" stroke-width="2.5" transform="rotate(-7 109 83)"/>
          <rect x="64" y="40" width="78" height="98" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
          <path d="M78 64h50" stroke="#cbe8e4" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M78 80h50" stroke="#cbe8e4" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M78 96h30" stroke="#cbe8e4" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="138" cy="116" r="23" fill="#e6fbf6" stroke="#10b981" stroke-width="3"/>
          <path d="M138 106v20M128 116h20" stroke="#0a6a62" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <p style="margin:0">You currently have no active applications for any students. Click <strong>Manage Students</strong> to create a new student and their application.</p>
        <p style="margin:16px 0 0"><a href="partner-students.html">Go to Manage Students</a></p>
      </div>

    </div>
  </main>

  <!-- Detail panel. Lives outside <main> because .pp-modal is fixed and must not
       inherit the work surface's stacking. It follows the console's own contract:
       hidden by visibility until .is-open is added, panel is .pp-modal__card.
       js/portal-data.js fills #ppAppBody. -->
  <div class="pp-modal" id="ppAppModal">
    <div class="pp-modal__backdrop" data-appclose></div>
    <div class="pp-modal__card pp-modal__card--lg" role="dialog" aria-modal="true" aria-labelledby="ppAppTitle">
      <div class="pp-modal__head">
        <h3 class="pp-modal__title" id="ppAppTitle">Application</h3>
        <button type="button" class="pp-modal__close" data-appclose aria-label="Close">&times;</button>
      </div>
      <div class="pp-modal__body" id="ppAppBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="/api/content/bootstrap.js"></script>
  <script src="js/store.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/portal-render.js"></script>
  <script src="js/portal-data.js"></script>
</body>
</html>
