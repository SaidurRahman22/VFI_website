# =============================================================================
# VFI production (single-VPS git-sync deploy) — the LIVE config at
# /etc/nginx/sites-enabled/vfi on the app server.
#
# Same-origin: the static site AND the Laravel API are served from one origin
# (Sanctum's cookie posture depends on it). The repo is checked out at
# /var/www/vfi and the site is served from the repo root, with the Laravel front
# controller (backend/public/index.php) as the fallback.
#
# SECURITY (Aug 2026): because the web root IS the repo root, the deny blocks
# below are load-bearing — without them nginx serves the app's PHP source,
# composer.json, and the .md docs (incl. secrets) as plaintext. Keep them.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/vfi;
    index index.html;

    client_max_body_size 25m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- security: never serve app source, VCS, docs, or config as static ----
    # The Laravel app is reached ONLY through the @backendpublic/@laravel fallback
    # (front controller), never via a literal /backend/ URL — so denying these
    # paths cannot affect the API. Frontend assets (css/js/img at the repo root)
    # are unaffected.
    location ^~ /backend/ { deny all; }
    location ^~ /deploy/  { deny all; }
    location ^~ /docs/    { deny all; }
    location ^~ /test/    { deny all; }
    location ~* \.(?:md|ya?ml|lock|sh|sql|example|dist|bak|ini|toml|log|env)$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }   # hide dotfiles (.env, .git etc.)

    # static site → Laravel public assets → Laravel front controller
    location / {
        try_files $uri $uri/ @backendpublic;
    }
    location @backendpublic {
        root /var/www/vfi/backend/public;
        try_files $uri @laravel;
    }
    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/vfi/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/vfi/backend/public;
    }

    location ~* \.(?:css|js|png|jpe?g|svg|webp|gif|ico|woff2?)$ {
        try_files $uri @backendpublic;
        expires 7d;
        add_header Cache-Control "public";
    }
}
