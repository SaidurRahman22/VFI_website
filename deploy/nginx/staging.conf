# =============================================================================
# VFI staging — the load-bearing invariant is ONE ORIGIN for both the static
# site and the API. Sanctum's cookie posture (Phase 1) depends on this.
# Phase 0, step 2 (docs/phases/phase-0-platform-and-delivery-foundation.md).
# =============================================================================

upstream php_fpm {
    server php-fpm:9000;         # default pool
}
upstream php_fpm_uploads {
    server php-fpm:9001;         # dedicated uploads pool — an upload never
}                                # starves the marketing site (Phase 0, step 3)

server {
    listen 80;
    server_name staging.vfi-edu.example;
    # Cloudflare terminates TLS in front; redirect any plain hit.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.vfi-edu.example;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS + baseline hardening
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The 52 static files, served verbatim from the repo root.
    root /srv/vfi/site;
    index index.html;

    client_max_body_size 25m;    # document uploads (Phase 3/5)

    # ---- API: same-origin proxy to PHP-FPM (Laravel public/index.php) --------
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass php_fpm;
        add_header Cache-Control "no-store" always;   # authed routes: never cache
    }

    # Sanctum CSRF cookie endpoint lives outside /api.
    location = /sanctum/csrf-cookie {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass php_fpm;
    }

    # Document uploads routed to the reserved FPM pool.
    location ~ ^/api/(admin|partner|student)/.*/documents {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_pass php_fpm_uploads;
    }

    # ---- Static site ---------------------------------------------------------
    # Hashed assets (images) can cache hard; HTML must stay fresh.
    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
