; Dedicated PHP-FPM pool for document uploads (Phase 0, step 3).
; Listens on :9001 so a slow ClamAV-gated upload never starves the pool that
; serves the marketing site (:9000). Kept deliberately small.
[uploads]
user = www-data
group = www-data
listen = 9001
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 200
request_terminate_timeout = 120s
