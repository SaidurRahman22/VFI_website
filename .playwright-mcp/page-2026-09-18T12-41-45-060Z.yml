            - generic [ref=e388]:
              - generic [ref=e389]:
                - generic [ref=e390]: DAAD Study Scholarships - Master Studies for All Academic Disciplines
                - generic [ref=e391]: PG (Master's) · For graduates applying from abroad to start a Master's degree in Germany. Your first degree should be no more than six years old, and you cannot apply if you have already lived in Germany for more than 15 months at the deadline. You apply to the DAAD through its own portal, not to Aalen University; the window opens on 1 June each year and funding starts in the winter semester. The DAAD does not pay tuition fees, but Aalen University can exempt DAAD scholarship holders from its EUR 1,500 per semester international fee. Paid for 10 to 24 months, with health, accident and liability insurance, a study allowance of EUR 460 a year and a travel allowance on request.
              - generic [ref=e392]:
                - generic [ref=e393]: EUR 992 / month
                - button "View & Apply" [ref=e394] [cursor=pointer]
            - generic [ref=e395]:
              - generic [ref=e396]:
                - generic [ref=e397]: Tuition fee exemption (not a scholarship)
                - generic [ref=e398]: UG / PG · Not a scholarship but the main fee relief available. Aalen University can waive the fee if you hold a DAAD scholarship, if you are a national of a state in the ACP partnership agreement (Africa, Caribbean and Pacific), if you are a national of a country the United Nations lists as a Least Developed Country, if you have a disability that substantially impedes study, or during a leave semester. Holders of a Baden-Wuerttemberg Stiftung scholarship and exchange students on a reciprocal partnership agreement are not charged the fee at all. Email your reason and evidence to gebuehren@hs-aalen.de before lectures begin. The student services and administration fees still apply.
              - generic [ref=e399]:
                - generic [ref=e400]: Waives EUR 1,500 / semester
                - button "View & Apply" [ref=e401] [cursor=pointer]
            - generic [ref=e402]:
              - generic [ref=e403]:
                - generic [ref=e404]: Baden-Wuerttemberg-STIPENDIUM (BWS) for university students
                - generic [ref=e405]: UG / PG (exchange semesters, not a full degree) · For one or two exchange semesters at Aalen, not for a full degree. It is awarded only through an existing partnership between Aalen University and your own university, so you apply through your home university's international office, which nominates you. Aalen's call for 2026/2027 closed on 31 March 2026 and is reissued each spring. Holders are also exempt from Aalen's EUR 1,500 per semester international fee. Paid for 3 to 11 months.
