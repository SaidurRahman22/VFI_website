                - generic [ref=e418]: Studierendenwerk Ulm hardship loan (interest-free)
                - generic [ref=e419]: "UG / PG · Emergency help, not a scholarship: it must be repaid. It is for students who fall into financial difficulty through no fault of their own and who do not receive BAfoeG. Studierendenwerk Ulm runs student finance for Aalen University; ask its office in Ulm for the application and, if you are an international student, ask first whether your residence status qualifies. An interest-free loan for a maximum of 12 months; the amount is not published."
