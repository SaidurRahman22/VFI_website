        - generic [ref=e437]:
          - heading "Admissions" [level=2] [ref=e438]
          - generic [ref=e439]:
            - generic [ref=e440]:
              - button "Bachelors" [ref=e441] [cursor=pointer]
              - button "Masters" [ref=e442] [cursor=pointer]
            - generic [ref=e444]:
              - paragraph [ref=e445]: Academic requirements
              - paragraph [ref=e446]: "You need a school-leaving certificate that Germany recognises as a university entrance qualification (Hochschulzugangsberechtigung). Aalen University does not assess this itself: you must apply to uni-assist for a preliminary review document (Vorprüfungsdokumentation, VPD) that confirms your certificate, and the VPD must be issued for Aalen University — one issued for a different university is not accepted. You can check your own country's case in advance in the DAAD admission database or in anabin. On top of the certificate, Aalen requires proof of eligibility to study in Germany in the form of one of three tests: the TestAS (paper-based or digital) core test plus the subject-specific engineering module with a score of at least 100, the SAT with at least 1050 points, or the ACT with a score of at least 20. The university states that this aptitude test requirement is suspended for the summer semester 2027 application period. If a school-leaving certificate is not recognised as equivalent, the standard route into a German bachelor's degree is a year at a Studienkolleg followed by the assessment examination (Feststellungsprüfung); Aalen's own pages do not describe this route, so ask the Admissions Office if your VPD shows you are not directly eligible."
              - paragraph [ref=e447]: English proficiency
              - paragraph [ref=e448]: "English-taught programmes require English at CEFR level B2, and the certificate must not be older than two years. Aalen publishes this list of accepted proofs and minimum scores: IELTS 6.0; TOEFL iBT 72; TOEFL ITP 543; TOEIC (Listening and Reading) 785; PTE Academic B2 64; Cambridge First grade B; Cambridge CAE grade C; Cambridge CPE grade C; UNIcert II certificate with grade 2.3. The Duolingo English Test is not on that list, and neither is a medium-of-instruction letter from a previous university. One point to check before you book a test: the university's own entry for the B.Eng. Mechanical Engineering programme in the DAAD International Programmes database gives the TOEFL iBT requirement as 72 overall for tests taken before 2026 (Reading 18, Listening 20, Speaking 17, Writing 17) and as 4.5 overall with 4.5 in each section for tests taken since 2026, under the new TOEFL score scale. The table on Aalen's own application page still shows only the figure 72, so confirm which scale applies to your test date with the Admissions Office. No German certificate is needed for admission to the English-taught bachelor's programmes, but international students who are not native German speakers take compulsory German language modules in the first two semesters."
              - paragraph [ref=e449]: Standardised tests
              - paragraph [ref=e450]: "The bachelor-level test requirement is the aptitude test described under academic requirements: TestAS core test plus engineering module with at least 100 points, SAT with at least 1050, or ACT with at least 20 — currently suspended for the summer semester 2027 application period. The separate Baden-Württemberg \"study orientation test\", which applicants holding a German school certificate must take, is expressly not required for Aalen's English-taught programmes. Applicants from India, China and Vietnam must obtain an APS certificate from the Academic Evaluation Centre and submit it to uni-assist together with their educational documents; the order is APS certificate first, then the uni-assist VPD, then the application. Every applicant with an international certificate needs the uni-assist VPD, which costs EUR 75 for the first programme and EUR 30 for each further programme in the same semester. The application itself is not filed through uni-assist: you submit it directly in Aalen University's own online application portal, upload the VPD and your other documents there, and post officially certified copies of your school-leaving certificate to the address shown in the portal. GRE and GMAT are not mentioned anywhere in Aalen's published bachelor requirements."
        - generic [ref=e451]:
          - heading "Placements" [level=2] [ref=e452]
          - generic [ref=e454]:
            - generic [ref=e455]: 88%
            - generic [ref=e456]: Placement rate
          - paragraph [ref=e457]: Every bachelor's degree at Aalen includes a practical semester in a company, normally in the fifth semester and at least 95 attendance days at a 40-hour week. Students find and propose their own placement, the internships office approves it and a professor supervises it. Many bachelor's and master's theses are written inside a company as well, and the in-depth-practice model lets students work in a partner company alongside their studies. The university surveys its graduates through KOAB with ISTAT and about 70 other universities. Of the 2023 graduates who went straight into work, 88% had found a job within six months and 78% were satisfied with their professional situation; 53% work in manufacturing or industry and about a quarter in the Ostalb district, and 64% joined internationally active companies. A further 52% of bachelor's graduates went on to a master's instead of straight into work, 60% of them at Aalen. 339 of 1,374 graduates replied.
          - paragraph [ref=e458]: Each degree programme runs its own alumni network, plus a university-wide LinkedIn group. The small-business (KMU) network is free to join and emails members jobs from partner companies.
          - paragraph [ref=e459]: "Average salary: Germany-wide, engineers with under one year of experience earn a median EUR 59,250 a year gross (Stepstone 2026). A national figure, not measured at Aalen."
