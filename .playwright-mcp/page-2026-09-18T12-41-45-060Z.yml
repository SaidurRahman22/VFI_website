            - article [ref=e292]:
              - generic [ref=e294]:
                - heading "Winter semester" [level=3] [ref=e295]
                - generic [ref=e296]: October
                - paragraph [ref=e297]: "The semester formally begins on 1 September and classes begin at the start of October. Application deadlines differ by programme, not by nationality: 15 July for German-taught Bachelor's programmes with a restricted entry grade (NC), 15 June for Master's programmes, and the first Friday after the first day of classes for German-taught Bachelor's and Master's programmes with no NC. The English-taught Bachelor's programmes have no winter intake. English-taught Master's programmes set their own winter deadlines, so check the programme page. International applicants need to start much earlier than the deadline: you must first obtain a Vorpruefungsdokumentation (VPD) from uni-assist issued for Aalen University, and applicants from India, China and Vietnam must obtain an APS certificate before the VPD."
            - article [ref=e298]:
              - generic [ref=e300]:
                - heading "Summer semester" [level=3] [ref=e301]
                - generic [ref=e302]: March
                - paragraph [ref=e303]: The semester formally begins on 1 March and classes begin in mid-March. This is the only intake for the English-taught Bachelor's programmes, and their deadline is 30 November. English-taught Master's programmes that take summer entrants apply a 15 December deadline. For German-taught programmes the summer deadlines are 15 January for Bachelor's programmes with a restricted entry grade (NC), 15 December for Master's programmes, and the first Friday after the first day of classes for programmes with no NC. The same deadlines apply to international and German applicants, but international applicants must allow extra months for the uni-assist VPD and, for India, China and Vietnam, the APS certificate that comes before it.
          - paragraph [ref=e304]: Applications open several months ahead — a counsellor can confirm the exact deadline for your course.
