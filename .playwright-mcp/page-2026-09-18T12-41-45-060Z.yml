                - columnheader "Annual expenses in EUR" [ref=e360]
            - rowgroup [ref=e361]:
              - row [ref=e362]:
                - cell "Tuition for non-EU/EEA students" [ref=e363]
                - cell "EUR 1,500 per semester. Two semesters make one academic year, so a full year of tuition is EUR 3,000." [ref=e364]
              - row [ref=e365]:
                - cell "Tuition for EU/EEA students" [ref=e366]
                - cell "No tuition fee. EU and EEA citizens pay only the semester contribution. The same applies to doctoral students, and to international students who hold a German school-leaving qualification." [ref=e367]
              - row [ref=e368]:
                - cell "Semester contribution (paid by every student)" [ref=e369]
                - cell "EUR 180 per semester (winter semester 2026/27). Not tuition, and nobody is exempt from it — including EU students, who pay no tuition." [ref=e370]
              - row [ref=e371]:
                - cell "Semester ticket for public transport" [ref=e372]
                - 'cell "Not included. Aalen''s semester ticket arrangement has ended, so travel is not covered by the semester contribution. Students buy their own ticket: the D-Ticket JugendBW costs EUR 45 per month for students up to and including age 26, and the standard Deutschlandticket costs EUR 63 per month in 2026. Both are valid on local and regional transport across Germany." [ref=e373]'
              - row [ref=e374]:
                - cell "Second-degree fee (Zweitstudiengebuehr)" [ref=e375]
                - cell "EUR 650 per semester, and it is charged instead of the EUR 1,500 fee, not on top of it. It applies to someone who has already completed both a Bachelor's and a Master's degree (or a state examination or diploma) in Germany and is starting a further degree. Degrees completed outside Germany do not count." [ref=e376]
          - paragraph [ref=e377]: "Note: these figures are approximate and change year to year. Check the current fee schedule on the university’s official website, or ask your VFI counsellor for the latest breakdown."
