          - heading "Overview" [level=2] [ref=e251]
          - generic [ref=e252]:
            - paragraph [ref=e253]: "Aalen University of Applied Sciences (Hochschule Aalen) is a public university of applied sciences in Aalen, Baden-Württemberg, in southern Germany. It was founded in 1962 as a state engineering school and became a university of applied sciences in 1971. It has over 4,000 students, 146 professors and five faculties: Chemistry, Electronics and Computer Science, Mechanical Engineering and Materials Science, Optics and Mechatronics, and Business and Health. Around 60 degree programmes are offered. A German university of applied sciences teaches for practice: laboratory work, projects with companies and practical semesters are built into the programmes rather than added to them. The year has two semesters, the winter semester from September to February and the summer semester from March to August. Most bachelor's programmes are taught in German; three bachelor's and eight master's programmes are taught entirely in English."
