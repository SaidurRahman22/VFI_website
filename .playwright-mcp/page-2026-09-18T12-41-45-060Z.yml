        - generic [ref=e352]:
          - heading "Cost to Study" [level=2] [ref=e353]
          - paragraph [ref=e354]: Students who are not EU or EEA citizens pay tuition of EUR 1,500 per semester — EUR 3,000 for a full academic year. Every student also pays a semester contribution of EUR 180 per semester (winter semester 2026/27), including EU students who pay no tuition; nobody is exempt from it. Both amounts are set by Baden-Württemberg state law and can change.
          - table [ref=e356]:
            - rowgroup [ref=e357]:
