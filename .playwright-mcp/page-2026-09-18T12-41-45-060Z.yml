                - generic [ref=e383]: Deutschlandstipendium
                - generic [ref=e384]: "UG / PG · Open to students of any nationality who are enrolled at, or are starting at, Aalen University. Selection is on academic performance and personal commitment; your financial situation is not considered. You apply online at the university once a year before the winter semester (the 2026 round ran 27 July to 9 August 2026). Contact: deutschlandstipendium@hs-aalen.de. Normally paid for two semesters."
