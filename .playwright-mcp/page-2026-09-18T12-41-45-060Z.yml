                - button "View & Apply" [ref=e408] [cursor=pointer]
            - generic [ref=e409]:
              - generic [ref=e410]:
                - generic [ref=e411]: Friedrich-Ebert-Stiftung, Grundfoerderung fuer Auslaender:innen
                - generic [ref=e412]: "UG / PG · For international students who are already enrolled at a German state or state-recognised institution, which includes a university of applied sciences such as Aalen, so it is applied for after you arrive rather than before. German at B2 level is required even if your course is taught in English. Master's students apply before or at the start of their first semester: by 30 November for the winter semester, by 31 May for the summer semester. You apply to the foundation, not to the university. Plus contributions to health insurance and EUR 255 a month extra for a child. It does not have to be repaid."
