<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="VFI Partner console — the Learning Resources library: country guides, forms, financial and visa documents." />
  <title>Learning Resources | VFI Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/partner-portal.css?v=0f2e7337" />
  <script>document.documentElement.className += " js";</script>
  <link rel="icon" type="image/png" href="assets/img/vfi-emblem.png?v=6d9b6c48" />
  <style>
    /* page-scoped: every selector prefixed .pg-res */
    .pg-res__panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (min-width: 981px) {
      .pg-res__panels { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr); }
    }
    .pg-res__panel {
      background: #fff;
      border: 1px solid var(--pp-line);
      border-radius: var(--pp-radius);
      box-shadow: var(--pp-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .pg-res__panelhead {
      padding: 16px 20px;
      font-family: var(--pp-display);
      font-weight: 700;
      color: var(--pp-ink);
      font-size: 17px;
      border-bottom: 1px solid var(--pp-line);
      background: var(--pp-card-2);
    }
    .pg-res__list {
      max-height: 470px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pg-res__list::-webkit-scrollbar { width: 8px; }
    .pg-res__list::-webkit-scrollbar-thumb { background: var(--pp-line); border-radius: 4px; }
    .pg-res__row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: var(--pp-radius-sm);
      border: 1px solid transparent;
      background: #fff;
      color: var(--pp-slate);
      font-family: var(--pp-display);
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      transition: background .16s var(--pp-ease), color .16s var(--pp-ease), box-shadow .16s var(--pp-ease);
    }
    .pg-res__row:hover { background: var(--pp-teal-soft); color: var(--pp-teal-dark); }
    .pg-res__row.is-active {
      background: linear-gradient(100deg, var(--pp-teal), var(--pp-teal-dark));
      color: #fff;
      box-shadow: 0 8px 20px rgba(13, 148, 136, .28);
    }
    .pg-res__flag {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid var(--pp-line);
      font-size: 19px;
      line-height: 1;
      overflow: hidden;
    }
    .pg-res__row .ic { color: var(--pp-muted); flex: none; transition: color .16s var(--pp-ease); }
    .pg-res__row:hover .ic { color: var(--pp-teal); }
    .pg-res__row.is-active .ic { color: #fff; }
    .pg-res__label { flex: 1 1 auto; min-width: 0; }
    .pg-res__chev { margin-left: auto; }
    /* category folder icon tint */
    .pg-res__folder { color: var(--pp-gold); }
    .pg-res__row:hover .pg-res__folder { color: var(--pp-warn); }
    .pg-res__row.is-active .pg-res__folder { color: #fff; }

    /* documents panel */
    .pg-res__docs { padding: 20px; }
    .pg-res .pp-search-wrap { position: relative; display: block; margin-bottom: 22px; }
    .pg-res__docs-title { font-size: 18px; font-family: var(--pp-display); font-weight: 700; color: var(--pp-ink); margin: 0 0 16px; }
    .pg-res__doclist { display: flex; flex-wrap: wrap; gap: 16px; }
    .pg-res__doc {
      width: 220px;
      max-width: 100%;
      border: 1px solid var(--pp-line);
      border-radius: var(--pp-radius);
      box-shadow: var(--pp-shadow-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: transform .16s var(--pp-ease), box-shadow .16s var(--pp-ease), border-color .16s var(--pp-ease);
    }
    .pg-res__doc:hover { transform: translateY(-3px); box-shadow: var(--pp-shadow); border-color: #d5e6e4; }
    .pg-res__doc-ic {
      width: 64px;
      height: 64px;
      margin: 6px auto 14px;
      display: grid;
      place-items: center;
      color: var(--pp-teal);
    }
    .pg-res__doc-ic .ic { width: 46px; height: 46px; stroke-width: 1.6; }
    .pg-res__doc-title { text-align: center; font-family: var(--pp-display); font-weight: 700; color: var(--pp-ink); font-size: 15px; }
    .pg-res__doc-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 16px 0;
      padding-top: 14px;
      border-top: 1px solid var(--pp-line-2);
      font-size: 12.5px;
      color: var(--pp-muted);
      font-weight: 600;
    }
    .pg-res__empty-hint { color: var(--pp-muted); font-size: 13.5px; margin-top: 4px; }

    /* js/portal-data.js repaints both filter panels with .pg-res__item buttons,
       a class no stylesheet defined — so the moment the server answered, two
       panels of styled rows turned into a column of unstyled browser buttons.
       Same look as .pg-res__row, which is what they replace. */
    .pg-res__item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      text-align: left; padding: 11px 13px;
      border-radius: var(--pp-radius-sm); border: 1px solid transparent;
      background: #fff; color: var(--pp-slate);
      font-family: var(--pp-display); font-weight: 600; font-size: 14.5px;
      cursor: pointer;
      transition: background .16s var(--pp-ease), color .16s var(--pp-ease), box-shadow .16s var(--pp-ease);
    }
    .pg-res__item:hover { background: var(--pp-teal-soft); color: var(--pp-teal-dark); }
    .pg-res__item.is-on {
      background: linear-gradient(100deg, var(--pp-teal), var(--pp-teal-dark));
      color: #fff; box-shadow: 0 8px 20px rgba(13, 148, 136, .28);
    }

    /* the document cards portal-data.js renders are <a> elements */
    a.pg-res__doc { text-decoration: none; color: inherit; }

    /* a row that names a document nobody has uploaded yet — rendered as a plain
       card, never as a link, so there is nothing to click and be let down by */
    .pg-res__doc--ph { cursor: default; background: var(--pp-card-2); }
    .pg-res__doc--ph:hover { transform: none; box-shadow: var(--pp-shadow-sm); border-color: var(--pp-line); }
    .pg-res__ph {
      display: inline-block; margin-top: 12px; padding: 3px 9px; border-radius: 999px;
      background: #fdf3e3; color: var(--pp-warn);
      font-size: 10.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
      text-align: center;
    }
    .pg-res__loading { color: var(--pp-muted); font-size: 13.5px; padding: 14px 13px; }
  </style>
</head>
<body class="pp" data-pp-page="resources">
  <a class="pp-skip" href="#pp-main">Skip to content</a>
  <div id="pp-chrome"></div>

  <main class="pp-main" id="pp-main">
    <div class="pp-wrap">

      <!-- page head -->
      <div class="pp-head pp-anim">
        <div>
          <nav class="pp-crumb" aria-label="Breadcrumb">
            <a href="partner-dashboard.html">Dashboard</a>
            <span class="pp-crumb__sep">&rsaquo;</span>
            <span class="pp-crumb__now">Learning Resources</span>
          </nav>
          <h1 class="pp-head__title">Learning Resources</h1>
        </div>
        <div class="pp-head__actions">
          <a class="pp-btn pp-btn--ghost" href="partner-email-updates.html"><svg class="ic ic--sm"><use href="#pi-mail"/></svg> Email Updates</a>
        </div>
      </div>

      <div class="pg-res">
        <div class="pg-res__panels pp-anim">

          <!-- Panel 1: Countries -->
          <section class="pg-res__panel" aria-label="Countries">
            <div class="pg-res__panelhead">Countries</div>
            <div class="pg-res__list" id="resCountries">
              <!-- These nine countries and the eight categories below were a
                   hardcoded guess at a catalogue nobody had published. The real
                   facet lists come from GET /api/partner/resources, which
                   returns the distinct countries and categories actually on
                   file, and js/portal-data.js replaces this list with them (or
                   hides the panel when there are none). Showing a confident
                   nine-country menu until that answer landed meant the first
                   thing on screen was the one part of the page that was not
                   real. -->
              <p class="pg-res__loading">Loading…</p>
            </div>
          </section>

          <!-- Panel 2: Select Category -->
          <section class="pg-res__panel" aria-label="Select Category">
            <div class="pg-res__panelhead">Select Category</div>
            <div class="pg-res__list" id="resCategories">
              <p class="pg-res__loading">Loading…</p>
            </div>
          </section>

          <!-- Panel 3: Documents -->
          <section class="pg-res__panel" aria-label="Documents">
            <div class="pg-res__docs">
              <div class="pp-search-wrap">
                <span class="pp-search-wrap__ic"><svg class="ic ic--sm"><use href="#pi-search"/></svg></span>
                <input class="pp-input" type="search" id="resSearch" placeholder="Search Document" aria-label="Search Document" />
              </div>
              <h2 class="pg-res__docs-title">Documents</h2>
              <div class="pg-res__doclist" data-ppr="docs">
                <!-- Two invented cards used to sit here, complete with a date
                     and a file size for documents that do not exist. They were
                     what a partner saw before the server answered, and what
                     they kept seeing if it never did. js/portal-data.js fills
                     this container from GET /api/partner/resources. -->
                <p class="pg-res__loading">Loading documents…</p>
              </div>
            </div>
          </section>

        </div>
      </div>

    </div>
  </main>

  <script src="js/api.js?v=51967f55"></script>
  <script src="/api/content/bootstrap.js"></script>
  <script src="js/store.js?v=643c4a7a"></script>
  <script src="js/portal.js?v=e13f6d9a"></script>
  <script src="js/portal-render.js?v=27b4b87c"></script>
  <script src="js/portal-data.js?v=88ee0de8"></script>
  <script>
    /* page-only wiring. ES5 to match js/.

       The two filter panels are now filled and wired by js/portal-data.js from
       the server's own facet lists, so the highlight-only toggler that used to
       live here is gone — it moved a teal bar between nine hardcoded countries
       and filtered nothing.

       What is left is the one thing this page has to say for itself: several of
       the published rows name a document that has never been uploaded. Their
       `url` is this very page, so every "PDF" opened a new tab onto Learning
       Resources — which a partner reads as a failed download, not as an empty
       catalogue, so they try again. The backend now marks those rows and sends
       `url: null` rather than a link to nowhere; this turns whatever reaches
       the DOM into a plainly labelled card that is not a link at all. */
    (function () {
      var $ = function (s, c) { return (c || document).querySelector(s); };
      var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
      var docs = $('[data-ppr="docs"]');
      if (!docs) return;

      /* A link is dead when it has no destination, or when its destination is
         the page it is already on. Compared after the browser has resolved it,
         so "partner-resources.html", "./partner-resources.html" and an absolute
         URL to the same path are all caught, and a genuine off-site guide at
         https://… is not. */
      function goesNowhere(a) {
        if (a.getAttribute("data-placeholder") === "1") return true;    // if the renderer ever says so outright
        var raw = a.getAttribute("href");
        if (!raw || raw === "#") return true;
        var there = String(a.href).split("#")[0].split("?")[0];
        var here = String(window.location.href).split("#")[0].split("?")[0];
        return there === here;
      }

      function neutralise() {
        $$("a.pg-res__doc", docs).forEach(function (a) {
          if (!goesNowhere(a)) return;
          /* Replaced, not just disabled: an <a> with its href removed still
             looks and reads like a link. Children are moved rather than
             re-serialised so nothing is re-parsed as HTML. */
          var card = document.createElement("span");
          card.className = "pg-res__doc pg-res__doc--ph";
          while (a.firstChild) card.appendChild(a.firstChild);
          var tag = document.createElement("span");
          tag.className = "pg-res__ph";
          tag.textContent = "Sample entry — no file uploaded yet";
          card.appendChild(tag);
          a.parentNode.replaceChild(card, a);
        });

        /* js/portal-render.js paints the same rows from the content bundle a
           moment before the API answers, and gives each one a Download button
           that has never had a file behind it. Brief, but it is still a control
           that cannot work, so it never gets to look live. */
        $$("[data-res-download]", docs).forEach(function (btn) {
          if (btn.disabled) return;
          btn.disabled = true;
          btn.setAttribute("aria-disabled", "true");
          btn.setAttribute("title", "No file has been uploaded for this entry yet.");
        });
      }

      neutralise();
      /* portal-data.js repaints this container on every filter and search, so
         each new set of rows has to be checked. neutralise() is idempotent —
         a replaced card is no longer an <a>, and a disabled button returns
         early — which is what keeps the observer from feeding itself. */
      if (window.MutationObserver) {
        new window.MutationObserver(neutralise).observe(docs, { childList: true, subtree: true });
      }
    })();
  </script>
</body>
</html>
